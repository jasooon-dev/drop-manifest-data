name: Daily Refresh

on:
  schedule:
    # 12:45 UTC daily = 7:45am America/Chicago (CDT) -- 15 min before the
    # Claude routine reads this data at 8:00am Chicago / 13:00 UTC.
    - cron: "45 12 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push auth: prefer a PAT stored as GH_PUSH_TOKEN (repo Settings ->
          # Secrets and variables -> Actions) over the default GITHUB_TOKEN,
          # since the default token's write access depends on a repo-level
          # "Workflow permissions" toggle that failed to take effect twice
          # (2026-08-31, 2026-09-01) for reasons never pinned down. Falls
          # back to GITHUB_TOKEN automatically if GH_PUSH_TOKEN isn't set.
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push data.json
        run: |
          git config user.name "Drop Manifest Bot"
          git config user.email "drop-manifest-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
